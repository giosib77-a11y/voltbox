<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sets the storefront's light/dark class on <html> before the body paints.
      Blocking and first on purpose. A file, not inline code: the CSP in
      render.yaml is script-src 'self' without 'unsafe-inline'.
    -->
    <script src="/theme-init.js"></script>
    <!-- The canvas colour of each storefront theme (DESIGN.md §2.2). -->
    <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0F" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="VoltBox — კაბელები, დამტენები, Power Bank-ები, ყურსასმენები და აქსესუარები ერთ სივრცეში."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The fonts are served from this origin (src/fonts.css). No preconnect and
      no third party: browsers partition their cache per site now, so Google
      Fonts bought nothing but two extra handshakes before the first paint and
      a copy of every visitor's IP address.

      Preloaded because the text is Georgian and the font is what renders it -
      without this the browser only discovers the file after parsing the CSS.
      Two preloads at most: the body face and the Georgian heading face (the
      hero h1 is the largest text on the home page).
    -->
    <link
      rel="preload"
      href="/fonts/noto-sans-georgian-georgian-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/noto-serif-georgian-georgian-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="canonical" href="__SITE_URL__/" />
    <title>VoltBox — ელექტრონიკის აქსესუარები</title>

    <!--
      What a shared link looks like.

      These are static on purpose. Facebook, Messenger, Viber and Telegram do
      not run JavaScript, so anything React sets later is invisible to them -
      a link pasted into a chat showed a bare URL with no title, no text and no
      picture. What is here is the shop's own card, which every page falls back
      to. Per-product previews would need the page rendered on a server; that
      decision is recorded in the checklist.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoltBox" />
    <meta property="og:locale" content="ka_GE" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="VoltBox — ელექტრონიკის აქსესუარები" />
    <meta
      property="og:description"
      content="კაბელები, დამტენები, Power Bank-ები, ყურსასმენები და აქსესუარები — ერთ სივრცეში."
    />
    <!-- PNG, not the site's SVG favicon: no chat app renders SVG in a preview. -->
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VoltBox — ელექტრონიკა და აქსესუარები" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voltbox
          POSTGRES_PASSWORD: voltbox
          POSTGRES_DB: voltbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voltbox"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://voltbox:voltbox@localhost:5432/voltbox_test
      DATABASE_URL: postgresql://voltbox:voltbox@localhost:5432/voltbox_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: pytest -q

      - name: Migrations apply to an empty database
        run: alembic upgrade head

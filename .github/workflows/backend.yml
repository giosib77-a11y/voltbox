name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voltbox
          POSTGRES_PASSWORD: voltbox
          POSTGRES_DB: voltbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voltbox"
          --health-interval 5s --health-timeout 3s --health-retries 10

      # The cross-worker rate limit assertion needs a real shared store;
      # in-process counters cannot demonstrate the property being tested.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://voltbox:voltbox@localhost:5432/voltbox_test
      DATABASE_URL: postgresql://voltbox:voltbox@localhost:5432/voltbox_test
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: pytest -q

      - name: Migrations apply to an empty database
        run: alembic upgrade head

  # ცალკე job, განზრახ. ზემოთა `quality` დამოკიდებულებებს `.[dev]`-ით აყენებს —
  # ანუ dev-extra-ებთანაც ერთად. პროდაქშენის იმიჯი კი მხოლოდ
  # `[project.dependencies]`-ს იღებს. სწორედ ამ სხვაობაში დაიმალა
  # `email-validator`: ლოკალურ venv-ში ძველი ინსტალაციიდან იყო შემორჩენილი,
  # ამიტომ ლოკალურად ყველაფერი მწვანე ჩანდა — სუფთა გარემოში კი
  # `import app.main` ImportError-ით ვარდებოდა.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t voltbox-api:ci .

      - name: The app must import and expose its full API surface
        env:
          DATABASE_URL: postgresql://u:p@h:5432/d
          JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
        run: |
          docker run --rm -e DATABASE_URL -e JWT_SECRET voltbox-api:ci python -c "
          import app.main as m
          paths = m.app.openapi()['paths']
          print(f'{len(paths)} paths')
          assert len(paths) >= 19, f'expected at least 19 paths, got {len(paths)}'
          "

name: backend

on:
  push:
    paths: &backend-paths
      - "backend/**"
      - ".github/workflows/backend.yml"
      # tests/test_error_messages.py reads this file: it asserts that every
      # error code the API can send has Georgian text on the other side. A
      # frontend-only change that removed one would not have run this job, and
      # the guard would have been silent about exactly the change it exists for.
      - "frontend/src/services/httpClient.js"
      # The audit step below installs pip-audit from this lock. Without this
      # line, a Dependabot pull request that bumps it would run no CI at all,
      # and the first run to use the new lock would be on main.
      - ".github/pip-audit/**"
  pull_request:
    paths: *backend-paths

# The only thing any job does with GITHUB_TOKEN is checkout reading the
# repository. setup-python's cache goes through the runner's own
# ACTIONS_RUNTIME_TOKEN. pip, pip-audit, docker build and the service
# containers reach public registries with no credentials. Nothing here writes
# to the repository, a pull request, a check, the security tab, or a package
# registry, or asks for an OIDC token.
permissions:
  contents: read

# On a pull request or a branch, a newer push makes the older run moot, so it
# is cancelled. On main every run gets a group of its own (run_id), so every
# commit keeps its own verdict. `cancel-in-progress: false` would not do that:
# a run still pending in a group is cancelled when the next one joins it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 17, because that is what Supabase runs. CI used to test against 16
        # while production was 17.6, so any behaviour that differs between the
        # two would have passed here and failed there - which is the one place
        # a version gap is guaranteed to be expensive.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltbox
          POSTGRES_PASSWORD: voltbox
          POSTGRES_DB: voltbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voltbox"
          --health-interval 5s --health-timeout 3s --health-retries 10

      # The cross-worker rate limit assertion needs a real shared store;
      # in-process counters cannot demonstrate the property being tested.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://voltbox:voltbox@localhost:5432/voltbox_test
      DATABASE_URL: postgresql://voltbox:voltbox@localhost:5432/voltbox_test
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
      APP_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # იმიჯისავე კონტრაქტი: ვერსიები და hash-ები lock-იდან, პროექტი ხელახლა
      # resolve-ის გარეშე, და `pip check` — lock, რომელიც pyproject.toml-ს ჩამორჩა,
      # აქ ჩავარდება. pip-ი განზრახ არ ახლდება: ეს ერთადერთ download-ი იქნებოდა,
      # რომელსაც არაფერი ამოწმებს. requirements-dev.txt requirements.txt-ის
      # constraint-ით generate-ებულია: ყველა საერთო პაკეტი იმავე ვერსიაზეა, ასე რომ
      # CI ზუსტად prod-ის ვერსიებს ტესტავს. --only-binary: მის გარეშე wheel-ის
      # hash-ის შეუმთხვევლობაზე pip-ი sdist-ზე გადავიდოდა და build backend-ს hash-ის
      # გარეშე ჩამოწერდა (იხ. Dockerfile).
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          pip install --no-deps --no-build-isolation --check-build-dependencies -e .
          pip check

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        run: mypy app scripts tests

      - name: Tests (pytest)
        run: pytest -q

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      # მოდელები და მიგრაციები ერთმანეთს არ უნდა დაშორდნენ. ინდექსი, რომელსაც
      # მიგრაცია raw SQL-ით ქმნის და მოდელი არ აცხადებს, autogenerate-ისთვის
      # ზედმეტია — შემდეგი მიგრაცია მას წაშლიდა და არაფერი ხმამაღლა არ
      # გატყდებოდა, უბრალოდ მოთხოვნები ნელა გახდებოდა.
      - name: Models and migrations agree (alembic check)
        run: alembic check

      # The scanner comes in under the same rule as everything above: from a
      # lock with hashes, wheels only. `pip install pip-audit`, or
      # pypa/gh-action-pip-audit (which installs pip-audit from a version range,
      # with no hashes), would be the one download in this job that nothing
      # verifies. Its own venv, so it cannot change the environment the tests
      # ran in.
      # All three locks: requirements.txt is the image, requirements-build.txt
      # builds its wheel, requirements-dev.txt is this job. --disable-pip audits
      # the pins as written instead of resolving them again. --strict fails the
      # step if any pin could not be audited, instead of skipping it quietly.
      # PyPI's advisories carry no severity, so any finding fails. To accept one
      # knowingly, add `--ignore-vuln <ID>` with a comment on why and until when.
      # Last, and even after a failure: it reads only the lock files, and an
      # advisory published upstream should not hide the test results.
      - name: Audit locked dependencies (pip-audit)
        if: ${{ !cancelled() }}
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --require-hashes --only-binary=:all: \
            -r ../.github/pip-audit/requirements.txt
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --strict --disable-pip --progress-spinner off \
            -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

  # ცალკე job, განზრახ. ზემოთა `quality` დამოკიდებულებებს `.[dev]`-ით აყენებს —
  # ანუ dev-extra-ებთანაც ერთად. პროდაქშენის იმიჯი კი მხოლოდ
  # `[project.dependencies]`-ს იღებს. სწორედ ამ სხვაობაში დაიმალა
  # `email-validator`: ლოკალურ venv-ში ძველი ინსტალაციიდან იყო შემორჩენილი,
  # ამიტომ ლოკალურად ყველაფერი მწვანე ჩანდა — სუფთა გარემოში კი
  # `import app.main` ImportError-ით ვარდებოდა.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build -t voltbox-api:ci .

      - name: The app must import and expose its full API surface
        env:
          DATABASE_URL: postgresql://u:p@h:5432/d
          JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
        run: |
          docker run --rm -e DATABASE_URL -e JWT_SECRET voltbox-api:ci python -c "
          import pathlib, sys
          import app.main as m

          paths = m.app.openapi()['paths']
          print(f'{len(paths)} paths')
          assert len(paths) >= 19, f'expected at least 19 paths, got {len(paths)}'

          # This job only proves the image has every dependency because
          # importing app.main happens to reach every module. Three missing
          # dependencies were found that way (email-validator, python-multipart,
          # httpx). One module left out of the import graph, or one import moved
          # inside a function, and the guarantee is gone with nothing to say so.
          root = pathlib.Path('app')
          on_disk = {
              '.'.join(f.relative_to(root.parent).with_suffix('').parts).removesuffix('.__init__')
              for f in root.rglob('*.py') if '__pycache__' not in f.parts
          }
          missed = sorted(on_disk - set(sys.modules))
          print(f'{len(on_disk)} modules, all imported' if not missed else '')
          assert not missed, f'not reached by importing app.main: {missed}'
          "

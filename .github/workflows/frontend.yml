name: frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ორივე data layer უნდა აშენდეს — `virtual:api-impl`-ის alias
        # ბილდის დროს იხსნება, ამიტომ mock-ის გატეხვა http-ის ბილდში არ ჩანს.
        api-mode: [mock, http]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (VITE_API_MODE=${{ matrix.api-mode }})
        env:
          VITE_API_MODE: ${{ matrix.api-mode }}
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

name: frontend

on:
  push:
    paths: ["frontend/**", "backend/scripts/export_mock_data.mjs", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/scripts/export_mock_data.mjs", ".github/workflows/frontend.yml"]

# The only thing any job does with GITHUB_TOKEN is checkout reading the
# repository. setup-node's cache goes through the runner's own
# ACTIONS_RUNTIME_TOKEN, and npm ci / npm audit reach the public registry with
# no credentials. Nothing here writes to the repository, a pull request, a
# check, the security tab, or asks for an OIDC token.
permissions:
  contents: read

# On a pull request or a branch, a newer push makes the older run moot, so it
# is cancelled. On main every run gets a group of its own (run_id), so every
# commit keeps its own verdict. `cancel-in-progress: false` would not do that:
# a run still pending in a group is cancelled when the next one joins it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # Lint and unit tests do not depend on the data layer, so they run once
  # rather than twice through the build matrix.
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      # Runtime dependencies only, at high and above. Runtime dependencies are
      # what ships to the browser. The dev tree (vite, vitest, eslint) runs on a
      # developer's machine and in this job. Its advisories concern the dev
      # server, the vitest UI, and how vitest resolves mock paths. CI starts
      # neither server, and the mocks are this repository's own test code.
      # Moderate is below the line because react-router's open advisories are
      # fixed only in a major upgrade: a step that is red from its first run
      # gets switched off.
      # npm still prints every finding; the level only decides the exit code.
      # Last, and even after a failure: it reads only package-lock.json, and an
      # advisory published upstream should not hide the lint and test results.
      - name: Audit runtime dependencies (npm audit)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ორივე data layer უნდა აშენდეს — `virtual:api-impl`-ის alias
        # ბილდის დროს იხსნება, ამიტომ mock-ის გატეხვა http-ის ბილდში არ ჩანს.
        api-mode: [mock, http]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (VITE_API_MODE=${{ matrix.api-mode }})
        env:
          VITE_API_MODE: ${{ matrix.api-mode }}
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  # frontend-სა და backend-ს შორის ერთადერთი პირდაპირი დამოკიდებულება:
  # `backend/scripts/export_mock_data.mjs` პირდაპირ აიმპორტებს
  # `frontend/src/data/*.js`-ს. `products.js`-ში export-ის სახელის შეცვლა
  # frontend-ის ბილდს არ ტეხს — ტყდება მხოლოდ seed, თანაც მოგვიანებით.
  # ეს ნაკერი აქ იმიტომ მოწმდება, რომ სწორედ frontend-ის ცვლილება ტეხს მას.
  mock-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Export mock data for the backend seed
        run: node backend/scripts/export_mock_data.mjs > mock.json

      - name: Validate the exported shape
        run: |
          node -e '
            const d = JSON.parse(require("fs").readFileSync("mock.json", "utf8"));
            for (const k of ["products", "categories", "brands"]) {
              if (!Array.isArray(d[k]) || d[k].length === 0) {
                throw new Error(`${k}: expected a non-empty array, got ${JSON.stringify(d[k])}`);
              }
            }
            for (const f of ["id", "slug", "name", "price", "category", "brand"]) {
              if (!(f in d.products[0])) throw new Error(`product is missing "${f}"`);
            }
            console.log(
              `ok — ${d.products.length} products, ${d.categories.length} categories, ${d.brands.length} brands`
            );
          '

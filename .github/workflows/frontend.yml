name: frontend

on:
  push:
    paths: ["frontend/**", "backend/scripts/export_mock_data.mjs", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/scripts/export_mock_data.mjs", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  # Lint and unit tests do not depend on the data layer, so they run once
  # rather than twice through the build matrix.
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ორივე data layer უნდა აშენდეს — `virtual:api-impl`-ის alias
        # ბილდის დროს იხსნება, ამიტომ mock-ის გატეხვა http-ის ბილდში არ ჩანს.
        api-mode: [mock, http]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (VITE_API_MODE=${{ matrix.api-mode }})
        env:
          VITE_API_MODE: ${{ matrix.api-mode }}
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  # frontend-სა და backend-ს შორის ერთადერთი პირდაპირი დამოკიდებულება:
  # `backend/scripts/export_mock_data.mjs` პირდაპირ აიმპორტებს
  # `frontend/src/data/*.js`-ს. `products.js`-ში export-ის სახელის შეცვლა
  # frontend-ის ბილდს არ ტეხს — ტყდება მხოლოდ seed, თანაც მოგვიანებით.
  # ეს ნაკერი აქ იმიტომ მოწმდება, რომ სწორედ frontend-ის ცვლილება ტეხს მას.
  mock-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export mock data for the backend seed
        run: node backend/scripts/export_mock_data.mjs > mock.json

      - name: Validate the exported shape
        run: |
          node -e '
            const d = JSON.parse(require("fs").readFileSync("mock.json", "utf8"));
            for (const k of ["products", "categories", "brands"]) {
              if (!Array.isArray(d[k]) || d[k].length === 0) {
                throw new Error(`${k}: expected a non-empty array, got ${JSON.stringify(d[k])}`);
              }
            }
            for (const f of ["id", "slug", "name", "price", "category", "brand"]) {
              if (!(f in d.products[0])) throw new Error(`product is missing "${f}"`);
            }
            console.log(
              `ok — ${d.products.length} products, ${d.categories.length} categories, ${d.brands.length} brands`
            );
          '

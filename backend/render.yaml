# The API as a Render service: what it is built from, where it runs, which
# path Render probes, and every environment variable a deployment needs. Its
# nightly clean-up job is left out while the API is on the free plan (below).
#
# Why in the repo: point the health check at /api/v1/health instead of
# /api/v1/health/live and nothing happens until the first database outage,
# which then becomes a restart loop that cannot end before Supabase comes
# back, and cancels any good deploy made during it (docs/deployment.md §9).
# That is one wrong click in a dashboard, and a dashboard setting is one
# nobody reviews.
#
# A Blueprint of its own, beside frontend/render.yaml rather than merged with
# it into one file at the root. The repo is split by side everywhere else - a
# Dockerfile, a compose file and a CI workflow each - and one file would buy
# nothing: the two services share no value a Blueprint could pass between
# them. What each needs of the other is a public address - the API's domain,
# the shop's origin - and fromService hands out another service's variables
# and private-network host, never its public URL, so those stay literals.
# Create it with "Blueprint Path" set to backend/render.yaml
# (docs/deployment.md §2). On each sync, what is named here overwrites the
# dashboard; variables the file does not name are kept.

# The one secret the API and the prune job read. A group, so a rotated database
# password is changed once and cannot be left behind on the job - a copy of
# DATABASE_URL on each service would have the job failing every night after
# the next rotation, visible only on its Runs page. Kept while the job is out,
# so restoring it is adding the job back and nothing in the dashboard.
#
# Empty on purpose. Render ignores `sync: false` inside a group, silently, so a
# secret cannot be declared here - DATABASE_URL is added to the group in the
# dashboard once it exists (docs/deployment.md §2). Until then the API's first
# deploy fails on a missing DATABASE_URL; adding it starts a new one.
envVarGroups:
  - name: voltbox-database
    envVars: []

services:
  - type: web
    runtime: docker
    name: voltbox-api
    # Supabase is in eu-central-1. Render's default is oregon, which would put
    # the Atlantic between every query and its answer, and a service's region
    # cannot be changed once it exists.
    region: frankfurt
    # A test deployment on onrender.com before the domain is bought. Free is
    # 0.1 CPU and the same 512 MB the image-decode ceiling in
    # docs/deployment.md is sized for, but it sleeps after 15 minutes without a
    # request and the next one waits about a minute for it (docs/deployment.md
    # §0). Back to 0.5c-512mb for the real launch. Change it here, not in the
    # dashboard - a sync would put this back.
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The Dockerfile's HEALTHCHECK probes the same path, for the same reason.
    # /api/v1/health answers 503 when the database is down, and Render restarts
    # an instance that fails this check - which does not bring Supabase back.
    # tests/test_render_blueprint.py fails if this changes.
    healthCheckPath: /api/v1/health/live
    # A frontend commit is no reason to rebuild the API.
    buildFilter:
      paths:
        - backend/**

    envVars:
      - fromGroup: voltbox-database

      # Everything else in gunicorn.conf.py's startup checks hangs off this.
      - key: APP_ENV
        value: production
      # The API's own name; the storefront's are CORS_ORIGINS. The service's
      # onrender.com name is added by app/core/config.py from
      # RENDER_EXTERNAL_HOSTNAME, so the health check passes before a custom
      # domain is verified.
      - key: TRUSTED_HOSTS
        value: api.voltbox.ge
      - key: CORS_ORIGINS
        value: https://voltbox.ge
      # Every URL in the sitemap and the admin link in each Telegram notice.
      - key: SITE_URL
        value: https://voltbox.ge

      # Render asks for these when the Blueprint is created, and only then:
      # later syncs ignore them, so a secret added after that is added in the
      # dashboard.
      - key: JWT_SECRET
        sync: false
      # Not secret, but not known yet: the address of the proxy in front.
      - key: FORWARDED_ALLOW_IPS
        sync: false
      # Two workers need shared rate-limit counters, or gunicorn refuses to start.
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are optional and not listed: a
      # prompt at creation is the only thing listing them would add, and either
      # one unset simply turns the notice off.

  # The nightly refresh-token prune (voltbox-prune-refresh-tokens) is not here
  # while the API is on free: Render has no free cron jobs - the schema's cron
  # plans start at 0.5c-512mb - and a paid resource does not belong in a free
  # deployment. Nothing breaks without it; refresh_tokens only grows. Restore
  # it with the move to a paid plan (docs/deployment.md §2, Cron job).

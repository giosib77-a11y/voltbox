# ლოკალური დეველოპმენტის გარემო.
# პროდაქშენში ბაზა Supabase-ია — ეს compose მხოლოდ dev/CI-სთვისაა.
services:
  db:
    image: postgres:17-alpine
    container_name: voltbox-pg
    environment:
      POSTGRES_USER: voltbox
      POSTGRES_PASSWORD: voltbox
      POSTGRES_DB: voltbox
    ports:
      - "55432:5432"
    volumes:
      - voltbox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltbox -d voltbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: voltbox-redis
    # მთვლელები არ არის მონაცემი, რომელიც უნდა გადარჩეს — persistence გამორთულია.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # პორტი host-ზე ისევე გამოგვაქვს, როგორც ბაზისა: ტესტები host-იდან ეშვება.
    # არასტანდარტული ნომერი, რომ ლოკალურ Redis-ს არ დაეჯახოს.
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://voltbox:voltbox@db:5432/voltbox
      APP_ENV: development
      # gunicorn ჩვეულებრივ მხოლოდ დეპლოიში გვხვდება, ამიტომ არა-production
      # გარემოში გაშვებაზე ის ჩერდება (იხ. gunicorn.conf.py). აქ ეს განზრახაა.
      ALLOW_NON_PRODUCTION_SERVER: "1"
      # ორი worker-ის მთვლელები საერთო უნდა იყოს, თორემ ლიმიტი ორმაგდება
      REDIS_URL: redis://redis:6379/0
      # `env_file: .env` აქ განზრახ არ არის: backend/.env ჩვეულებრივ ლაივ
      # Supabase-ზე მიუთითებს, და container-ში მისი ცვლადები ლაივ bucket-ში
      # ატვირთვას, ნამდვილ Telegram-ს და ნამდვილ ელფოსტას ჩართავდა. ლოკალურ
      # API-ს მხოლოდ ქვემოთ ჩამოთვლილი მნიშვნელობები აქვს; `.env` container-ში
      # არასდროს ხვდება.
      # ცხადი ლოკალური მნიშვნელობა, არა საიდუმლო (Settings მინიმუმ 32 სიმბოლოს ითხოვს).
      JWT_SECRET: local-compose-only-not-a-secret-0000000000
      # ბაზა `db` host-ზეა და requires_ssl მას არა-ლოკალურად ჩათვლის, ამიტომ
      # ნაგულისხმევი `require` TLS-ს მოითხოვდა, რომელსაც ლოკალური Postgres არ აქვს.
      DB_SSL_MODE: disable
      # გარე სერვისები გამორთულია: ცარიელი მნიშვნელობა = ფუნქცია გამორთულია
      # (სურათები მეხსიერებაში, Telegram და ელფოსტა არ იგზავნება).
      SUPABASE_PROJECT_REF: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      RESEND_API_KEY: ""
      EMAIL_FROM: ""
    ports:
      - "8000:8000"
    profiles: ["full"]   # `docker compose up` ნაგულისხმევად მხოლოდ ბაზას უშვებს

volumes:
  voltbox-pgdata:

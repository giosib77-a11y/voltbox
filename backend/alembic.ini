[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Left empty on purpose: alembic/env.py reads the real URL from Settings so the
# secret is not duplicated. NOTE: configparser reads this file with the locale
# encoding, so keep it ASCII-only.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

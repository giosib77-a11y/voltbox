[project]
name = "voltbox-backend"
version = "0.1.0"
description = "VoltBox — REST API for the Georgian electronics store"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0; sys_platform != 'win32'",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.14",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "slowapi>=0.1.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
# RUF001-003: ქართული ტექსტი კომენტარებში „ორაზროვან“ უნიკოდად ითვლება — ეს ჩვენთვის ნორმაა
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501", "N999"]
"scripts/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["slowapi.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# ტესტებიც იმავე loop-ზე უნდა იყოს, რაზეც fixture-ები —
# თორემ asyncpg-ის კავშირი სხვა event loop-იდან იკითხება და ჩავარდება
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
